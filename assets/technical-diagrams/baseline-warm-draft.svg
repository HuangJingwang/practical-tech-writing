<rect width="1200" height="720" fill="#FAF9F6"/><text x="48" y="76" text-anchor="start" font-family="PingFang SC" font-size="32" font-weight="600" fill="#30362F">确认后再执行</text><text x="48" y="116" text-anchor="start" font-family="PingFang SC" font-size="20" font-weight="400" fill="#677064">简化流程示意 · 用于校准绘图风格，不代表项目内部实现</text><path d="M264 304 L344 304" fill="none" stroke="#788171" stroke-width="2"  marker-end="url(#arrow)"/>
