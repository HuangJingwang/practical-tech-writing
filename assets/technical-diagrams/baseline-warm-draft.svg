<rect x="344" y="248" width="216" height="112" rx="12" fill="#EAF0E6" stroke="#718568" stroke-width="1.5"/><text x="452" y="296" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="600" fill="#30362F">生成建议</text><text x="452" y="329" text-anchor="middle" font-family="PingFang SC" font-size="20" font-weight="400" fill="#677064">保留待确认内容</text>
<polygon points="748,248 856,304 748,360 640,304" fill="#F7EEDB" stroke="#A38B56" stroke-width="1.5"/><text x="748" y="312" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="600" fill="#30362F">确认？</text>
<rect x="936" y="248" width="216" height="112" rx="12" fill="#FFFFFF" stroke="#B9C1B4" stroke-width="1.5"/><text x="1044" y="296" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="600" fill="#30362F">执行写入</text><text x="1044" y="329" text-anchor="middle" font-family="PingFang SC" font-size="20" font-weight="400" fill="#677064">返回处理结果</text>
