<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<title>确认后再执行</title><desc>请求经过建议生成和人工确认；确认后写入，拒绝则结束且保留原数据。</desc>
<metadata>{&quot;theme&quot;:&quot;sincerely-tech-v1&quot;,&quot;version&quot;:&quot;1.0.0&quot;}</metadata>
